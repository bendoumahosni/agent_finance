# Lancer explicitement :
#   docker compose -f docker-compose.prod.yml up -d --build
# Le -f est obligatoire : sans lui Compose chargerait aussi
# docker-compose.override.yml, qui monte le code et active --reload.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Aucun "ports" : la base n'est joignable que par le réseau interne.

  # Service à usage unique : applique les migrations puis s'arrête.
  # L'API ne démarre qu'une fois qu'il a réussi — c'est ce qui supprime
  # définitivement les "relation ... does not exist".
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Derrière Caddy : sans ça, Keycloak émet des URLs pointant vers
      # le conteneur au lieu de l'adresse publique.
      KC_HOSTNAME: https://auth.${DOMAIN}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data

  currency-mcp:
    build: ./mcp-servers/currency
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OIDC_ISSUER: https://auth.${DOMAIN}/realms/${KEYCLOAK_REALM}
      OIDC_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      PUBLIC_BASE_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      currency-mcp:
        condition: service_started
    # Aucun "ports" : seul Caddy parle à l'API.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - keycloak

volumes:
  pgdata:
  keycloak_data:
  caddy_data:
  caddy_config: